# Caddy terminates TLS in front of this container, so $scheme is always http here. Keep the
# protocol Caddy reports when there is one, so the api sees https and sets Secure cookies.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

  # The API is proxied under the same origin, so the browser never makes a
  # cross-site request and the session cookie stays first-party.
  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  # File names under /assets/ carry a content hash, so they can be cached for good.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html is the one file that must always be fetched fresh: it names the
  # current hashed assets.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Any other path is a client-side route.
  location / {
    try_files $uri /index.html;
  }
}
