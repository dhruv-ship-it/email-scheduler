services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scheduler
      POSTGRES_DB: scheduler
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scheduler}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'scheduler', '-d', 'scheduler']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --appendfsync everysec --maxmemory-policy noeviction
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.24
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - '9200:9200'
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fs "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s"']
      interval: 10s
      timeout: 10s
      retries: 30

  migrate:
    image: scheduler-server:local
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://scheduler:${POSTGRES_PASSWORD:-scheduler}@postgres:5432/scheduler
    command: ['node', 'dist/migrate.js']
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ['app']

  api:
    image: scheduler-server:local
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    env_file: .env
    environment:
      ROLE: api
      DATABASE_URL: postgres://scheduler:${POSTGRES_PASSWORD:-scheduler}@postgres:5432/scheduler
      REDIS_URL: redis://redis:6379
      ELASTICSEARCH_URL: http://elasticsearch:9200
    stop_grace_period: 30s
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    profiles: ['app']

  worker:
    image: scheduler-server:local
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    env_file: .env
    environment:
      ROLE: worker
      DATABASE_URL: postgres://scheduler:${POSTGRES_PASSWORD:-scheduler}@postgres:5432/scheduler
      REDIS_URL: redis://redis:6379
      ELASTICSEARCH_URL: http://elasticsearch:9200
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    profiles: ['app']

  web:
    image: scheduler-web:local
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '5173:80'
    depends_on:
      - api
    profiles: ['app']

volumes:
  postgres_data:
  redis_data:
  es_data:
